name: Vue
description: >-
  Vue (Vue Technology) was an item-level RFID hardware and software company
  based in Lake Forest, California, backed by Canaan Partners at Series A. Its
  product family combined RFID readpoints and networking devices with a software
  platform for real-time, item-level inventory monitoring and tracking, with
  notable retail rollouts including American Apparel. Tyco's Sensormatic
  Electronics acquired Vue Technology in October 2008 for approximately $43M, so
  the company no longer operates as an independent entity. It surfaced in the API
  Evangelist network as a Canaan Partners portfolio lead; enrichment finds no
  active developer portal, public API, or first-party artifacts to catalog.
